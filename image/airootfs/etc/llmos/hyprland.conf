# Hyprland as a hidden substrate: no bar, no gaps, no animations.
# Workspace 1 holds the shell (Chromium in kiosk mode); real windows the
# assistant opens go to workspace 2. The assistant drives it with hyprctl.
monitor = , preferred, auto, 1

exec-once = /usr/local/bin/llmos-launch

env = XCURSOR_SIZE,24

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
    layout = dwindle
}

decoration {
    rounding = 0
}

animations {
    enabled = false
}

input {
    kb_layout = us
    follow_mouse = 1
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

# The only keys the user needs: back to the shell, over to real windows.
bind = SUPER, escape, workspace, 1
bind = SUPER, tab, workspace, 2
bind = SUPER, Q, killactive
bind = SUPER SHIFT, E, exit
